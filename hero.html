<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pitch — Don't just present. Pitch.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --line: rgba(255, 255, 255, 0.22);
    --glass: rgba(255, 255, 255, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #1b2155;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ---------- Lottie "Beats Light" background ---------- */
  #bg-lottie {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background: #0b1a3a;
  }
  #bg-lottie svg {
    width: 100% !important;
    height: 100% !important;
  }
  /* readability veil over the gradient */
  .bg-veil {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(
      ellipse at 50% 35%,
      rgba(0, 0, 0, 0) 0%,
      rgba(0, 0, 0, 0.28) 100%
    );
    pointer-events: none;
  }

  /* ---------- Nav ---------- */
  nav {
    background: #fff;
    box-shadow: 0 2px 14px rgba(0,0,0,0.10);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1240px;
    margin: 0 auto;
    padding: 16px 40px;
  }
  .nav-left { display: flex; align-items: center; gap: 44px; }
  .logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  .logo img {
    display: block;
    height: 32px;
    width: auto;
  }
  .nav-links {
    display: flex; align-items: center; gap: 28px; list-style: none;
  }
  .nav-links a {
    color: #4a4a4a; text-decoration: none;
    font-size: 15px; font-weight: 500;
    transition: color 0.15s ease;
  }
  .nav-links a:hover { color: #8cc63f; }
  .nav-right { display: flex; align-items: center; gap: 32px; }

  .btn {
    border: none; cursor: pointer; font-family: inherit;
    font-weight: 600; border-radius: 999px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .login {
    background: transparent; color: var(--ink);
    font-size: 15px; padding: 10px 16px;
  }
  .login:hover { background: rgba(255,255,255,0.12); }
  .signup {
    background: #8cc63f; color: #fff;
    font-size: 15px; padding: 11px 24px;
  }
  .signup:hover {
    transform: translateY(-1px);
    background: #7db52f;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    max-width: 1080px;
    margin: 0 auto;
    padding: 170px 32px 60px;
    text-align: center;
    z-index: 1;
  }
  .hero h1,
  .hero .sub,
  .hero .actions,
  .hero .deck {
    position: relative;
    z-index: 2;
  }

  /* ---------- Floating elements ---------- */
  .floaty {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 14px 26px rgba(0,0,0,0.22));
    will-change: transform;
  }
  .f1 { width: 110px; top: 70px;  left: 4%;   animation: bob 11s ease-in-out infinite; }
  .f2 { width: 110px; top: 70px;  right: 4%;  animation: bob 11s ease-in-out infinite reverse; }
  .f3 { width: 80px;  top: 220px; left: 2%;   animation: spin 38s linear infinite; }
  .f4 { width: 80px;  top: 220px; right: 2%;  animation: spin 38s linear infinite reverse; }
  .f5 { width: 100px; top: 360px; left: 14%;  animation: bob 13s ease-in-out infinite reverse; }
  .f6 { width: 100px; top: 360px; right: 14%; animation: bob 13s ease-in-out infinite; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-26px); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--glass);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 999px;
    margin-bottom: 36px;
  }
  .eyebrow .pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: #6bf0ff;
    box-shadow: 0 0 10px #6bf0ff;
  }

  h1 {
    font-size: clamp(34px, 5.5vw, 68px);
    line-height: 1.02; font-weight: 800;
    letter-spacing: -0.05em; margin-bottom: 30px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.25);
  }
  h1 .hl {
    color: #16235c;
    text-shadow: none;
  }

  .sub {
    font-size: clamp(17px, 1.6vw, 21px);
    line-height: 1.5; color: var(--muted);
    max-width: 660px; margin: 0 auto 40px; font-weight: 450;
  }

  .actions {
    display: flex; gap: 12px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 22px;
  }
  .btn-primary {
    background: #fff; color: #1b2155;
    font-size: 16px; padding: 16px 30px;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 34px rgba(0,0,0,0.30);
  }
  .btn-secondary {
    background: var(--glass);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    border: 1px solid var(--line);
    font-size: 16px; padding: 16px 30px;
  }
  .btn-secondary:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.18);
  }

  .proof { font-size: 14px; color: var(--muted); font-weight: 500; }

  /* ---------- Product mock ---------- */
  .deck {
    position: relative; z-index: 1;
    max-width: 920px; margin: 64px auto 0;
    background: #fff; border-radius: 16px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.40);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .deck-bar {
    display: flex; align-items: center; gap: 7px;
    padding: 13px 18px; background: #faf9f7;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .deck-body {
    padding: 32px;
    background: #fff;
  }
  .deck-graphic-wrap { position: relative; width: 100%; }
  .deck-graphic {
    display: block;
    width: 100%;
    height: auto;
  }
  .ig-overlay { position: absolute; inset: 0; }
  .hotspot {
    position: absolute;
    display: block;
    border-radius: 14px;
    transition: background .18s ease, box-shadow .18s ease;
  }
  .hotspot.round { border-radius: 50%; }
  .hotspot:hover, .hotspot:focus-visible {
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 2px rgba(59, 160, 255, 0.6), 0 10px 24px rgba(0, 0, 0, 0.18);
    outline: none;
  }

  /* ---------- IWC diagram ---------- */
  .iwc-diagram {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 60px auto 0;
    aspect-ratio: 1054 / 535;
  }
  .iwc-connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .iwc-center-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 26%;
    height: auto;
    transform: translate(-50%, -50%);
    z-index: 2;
    animation: iwcCenterEntrance 600ms ease-out;
    filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.35));
    pointer-events: none;
  }
  @keyframes iwcCenterEntrance {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .iwc-node {
    position: absolute;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    z-index: 3;
    transition: transform .2s ease, filter .2s ease;
  }
  .iwc-node-right { flex-direction: row; }
  .iwc-node:hover, .iwc-node:focus-visible {
    transform: translateY(-2px);
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.3));
    outline: none;
  }
  .iwc-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  }
  .iwc-icon svg { width: 26px; height: 26px; }
  .iwc-icon-blue  { background: linear-gradient(135deg, #18497D, #0898D7); }
  .iwc-icon-green { background: linear-gradient(135deg, #4A8628, #B3D4A0); }
  .iwc-label {
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    white-space: nowrap;
  }

  .iwc-pill {
    position: absolute;
    bottom: -2%;
    padding: 9px 22px;
    border-radius: 999px;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    z-index: 3;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    transition: transform .2s ease, filter .2s ease;
  }
  .iwc-pill:hover, .iwc-pill:focus-visible {
    transform: translateY(-2px);
    filter: brightness(1.08);
    outline: none;
  }
  .iwc-pill-blue  { background: #18497D; left: 27%; }
  .iwc-pill-green { background: #4A8628; right: 27%; }

  /* ---------- Diagram (vendored SVG) ---------- */
  .diagram-wrap {
    width: 100%;
    max-width: 1100px;
    margin: 60px auto 0;
    padding: 0 20px;
    box-sizing: border-box;
  }
  .diagram-svg {
    display: block;
    width: 100%;
    height: auto;
  }

  @media (max-width: 720px) {
    .iwc-label { font-size: 12px; }
    .iwc-icon { width: 44px; height: 44px; }
    .iwc-icon svg { width: 20px; height: 20px; }
    .iwc-pill { font-size: 12px; padding: 7px 14px; }
  }

  /* ---------- Logo strip ---------- */
  .logos-wrap {
    position: relative; z-index: 1;
    max-width: 1080px; margin: 90px auto 70px;
    padding: 0 32px; text-align: center;
  }
  .logos-label {
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 30px;
  }
  .logos {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 48px;
  }
  .logos span {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    color: #fff; opacity: 0.55; transition: opacity 0.2s ease;
  }
  .logos span:hover { opacity: 0.9; }

  @media (max-width: 720px) {
    .nav-links { display: none; }
    .deck-body { grid-template-columns: 1fr; }
    nav { padding: 18px 20px; }
    .hero { padding-top: 64px; }
    .logos { gap: 28px; }
    .logos span { font-size: 18px; }
  }
</style>
</head>

  <div class="bg-veil"></div>

  <nav>
   <div class="nav-inner">
    <div class="nav-left">

        <img src="imageworks-logo.png.png" alt="imageworks Creative" />

  </header>
